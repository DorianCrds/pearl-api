version: "3.9"

services:
  api:
    build: .
    ports:
      - "4000:4000"  # Expose API port
      - "5555:5555"  # Prisma Studio
    environment:
      NODE_ENV: development
      PORT: 4000
      TS_NODE_DEV: "--poll"
    volumes:
      - .:/app           # Mount local code for hot reload
      - /app/node_modules # Keep node_modules inside container
    depends_on:
      - db
    command: sh -c "npx prisma migrate deploy && npm run dev"

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pearl_user
      POSTGRES_PASSWORD: pearl_password
      POSTGRES_DB: pearl_db
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
